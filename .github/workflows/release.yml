# .github/workflows/release.yml
# When a revision tag such as triage-main-revA is pushed:
#   1. build the full fab + assembly package with scripts/build-release.sh
#   2. attach it to a GitHub Release named exactly like the tag
# Tags containing "-rc" (triage-main-revB-rc1) become pre-releases: for review, not for ordering.
name: release

on:
  push:
    tags:
      - "*-rev*"

permissions:
  contents: write   # allows the workflow to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # "-full" includes KiCad's own 3D models, needed for a complete STEP export.
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install zip
        run: command -v zip || (apt-get update && apt-get install -y --no-install-recommends zip)

      - name: Build release package (fails on any ERC/DRC error or revision mismatch)
        run: bash scripts/build-release.sh "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: out/

      - name: Create the GitHub Release
        run: |
          EXTRA=""
          if [[ "$TAG" == *-rc* ]]; then EXTRA="--prerelease"; fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "out/$TAG-release-notes.md" \
            --verify-tag $EXTRA \
            "out/$TAG-release.zip" \
            "out/$TAG/$TAG-gerbers.zip" \
            "out/$TAG/SHA256SUMS"
